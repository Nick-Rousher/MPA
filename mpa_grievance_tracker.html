<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MPA Grievance Tracker</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        mpaBlue: '#0A2540', /* Deep professional police blue */
                        mpaGold: '#D4AF37', /* Metallic gold for badges/accents */
                        mpaLightBlue: '#1a3c63'
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        
        body { font-family: 'Inter', sans-serif; }
        
        /* Custom scrollbar for a polished look */
        ::-webkit-scrollbar {
            height: 8px;
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f5f9; 
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1; 
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #94a3b8; 
        }

        .kanban-column {
            min-width: 300px;
        }

        .drag-over {
            background-color: rgba(212, 175, 55, 0.1);
            border: 2px dashed #D4AF37 !important;
        }

        .grievance-card {
            cursor: grab;
            transition: transform 0.1s ease, box-shadow 0.1s ease;
        }
        
        .grievance-card:active {
            cursor: grabbing;
        }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 h-screen flex flex-col overflow-hidden">

    <header class="bg-mpaBlue text-white shadow-md border-b-4 border-mpaGold py-4 px-6 flex justify-between items-center z-10 shrink-0">
        <div class="flex items-center gap-3">
            <!-- Simple SVG Shield Icon representing Police Association -->
            <svg class="w-8 h-8 text-mpaGold" fill="currentColor" viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg">
                <path fill-rule="evenodd" d="M10 1.944A11.954 11.954 0 012.166 5C2.056 5.649 2 6.319 2 7c0 5.225 3.34 9.67 8 11.317C14.66 16.67 18 12.225 18 7c0-.682-.057-1.35-.166-2.001A11.954 11.954 0 0110 1.944zM11 14a1 1 0 11-2 0 1 1 0 012 0zm0-7a1 1 0 10-2 0v3a1 1 0 102 0V7z" clip-rule="evenodd"></path>
            </svg>
            <div>
                <h1 class="text-xl font-bold tracking-wide">Mesa Police Association</h1>
                <p class="text-xs text-mpaGold font-semibold uppercase tracking-wider">Grievance & Discipline Tracker</p>
            </div>
        </div>
        <button onclick="toggleForm()" class="bg-mpaGold hover:bg-yellow-500 text-mpaBlue font-bold py-2 px-4 rounded shadow transition-colors flex items-center gap-2">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
            <span class="hidden sm:inline">New Grievance</span>
        </button>
    </header>

    <!-- Form Overlay / Modal (Hidden by default) -->
    <div id="formModal" class="fixed inset-0 bg-black bg-opacity-50 z-50 flex items-center justify-center hidden opacity-0 transition-opacity duration-300">
        <div class="bg-white rounded-lg shadow-xl border-t-4 border-mpaGold w-full max-w-lg mx-4 transform scale-95 transition-transform duration-300" id="formContainer">
            <div class="p-6">
                <div class="flex justify-between items-center mb-4">
                    <h2 class="text-2xl font-bold text-mpaBlue">Log New Incident</h2>
                    <button onclick="toggleForm()" class="text-gray-400 hover:text-gray-700">
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                    </button>
                </div>
                
                <form id="grievanceForm" onsubmit="handleFormSubmit(event)">
                    <div class="space-y-4">
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">Officer Name</label>
                            <input type="text" id="officerName" required class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-mpaGold focus:border-transparent">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">Badge Number</label>
                            <input type="text" id="badgeNumber" required class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-mpaGold focus:border-transparent">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">Date of Incident / Notice</label>
                            <input type="date" id="incidentDate" required class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-mpaGold focus:border-transparent">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">Brief Description</label>
                            <textarea id="description" rows="3" required class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-mpaGold focus:border-transparent"></textarea>
                        </div>
                    </div>
                    
                    <div class="mt-6 flex justify-end gap-3">
                        <button type="button" onclick="toggleForm()" class="px-4 py-2 text-gray-600 bg-gray-100 hover:bg-gray-200 rounded-md font-medium transition-colors">Cancel</button>
                        <button type="submit" class="px-4 py-2 bg-mpaBlue hover:bg-mpaLightBlue text-white rounded-md font-medium transition-colors shadow-sm">Save Record</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Kanban Board -->
    <main class="flex-1 overflow-x-auto overflow-y-hidden p-6">
        <div class="flex gap-6 h-full items-start" id="kanbanBoard">
            <!-- Columns will be injected by JavaScript here -->
        </div>
    </main>

    <script>
        // Define the exact stages required
        const STAGES = [
            "NOI Served",
            "Interview scheduled",
            "Interview Completed",
            "Adjudicated",
            "Rebuttal Submitted",
            "Closed"
        ];

        // State to hold grievances
        let grievances = [];

        // DOM Elements
        const kanbanBoard = document.getElementById('kanbanBoard');
        const formModal = document.getElementById('formModal');
        const formContainer = document.getElementById('formContainer');
        const grievanceForm = document.getElementById('grievanceForm');

        // Load data from LocalStorage
        function loadGrievances() {
            const stored = localStorage.getItem('mpa_grievances');
            if (stored) {
                grievances = JSON.parse(stored);
            }
        }

        // Save data to LocalStorage
        function saveGrievances() {
            localStorage.setItem('mpa_grievances', JSON.stringify(grievances));
        }

        // Render the entire Kanban board
        function renderBoard() {
            kanbanBoard.innerHTML = ''; // Clear existing

            STAGES.forEach((stage, index) => {
                // Create Column Container
                const col = document.createElement('div');
                col.className = 'kanban-column flex flex-col bg-gray-200 rounded-lg max-h-full border border-gray-300 shadow-sm shrink-0 w-80';
                
                // Column Header
                const stageCount = grievances.filter(g => g.stage === stage).length;
                const header = document.createElement('div');
                header.className = 'p-3 border-b border-gray-300 bg-gray-100 rounded-t-lg flex justify-between items-center';
                header.innerHTML = `
                    <h3 class="font-semibold text-mpaBlue flex items-center gap-2">
                        <span class="bg-mpaBlue text-mpaGold text-xs px-2 py-1 rounded-full font-bold">${index + 1}</span>
                        ${stage}
                    </h3>
                    <span class="text-sm font-medium text-gray-500 bg-gray-200 px-2 py-0.5 rounded-full">${stageCount}</span>
                `;
                
                // Dropzone for Drag and Drop
                const dropzone = document.createElement('div');
                dropzone.className = 'p-3 flex-1 overflow-y-auto space-y-3 transition-colors duration-200 min-h-[150px]';
                dropzone.dataset.stage = stage;
                
                // Drag & Drop Event Listeners on the Dropzone
                dropzone.addEventListener('dragover', handleDragOver);
                dropzone.addEventListener('dragleave', handleDragLeave);
                dropzone.addEventListener('drop', handleDrop);

                // Populate Cards for this stage
                const stageGrievances = grievances.filter(g => g.stage === stage);
                stageGrievances.forEach(g => {
                    const card = createCardElement(g);
                    dropzone.appendChild(card);
                });

                col.appendChild(header);
                col.appendChild(dropzone);
                kanbanBoard.appendChild(col);
            });
        }

        function createCardElement(grievance) {
            const card = document.createElement('div');
            card.className = 'grievance-card bg-white p-4 rounded-md shadow border-l-4 border-mpaGold relative group';
            card.draggable = true;
            card.dataset.id = grievance.id;

            // Drag event listeners for the card
            card.addEventListener('dragstart', handleDragStart);
            card.addEventListener('dragend', handleDragEnd);

            // Format date for display
            const dateObj = new Date(grievance.date);
            // Handling timezone offset to show correct local date
            const formattedDate = new Date(dateObj.getTime() + Math.abs(dateObj.getTimezoneOffset() * 60000)).toLocaleDateString();

            // Mobile-friendly Stage Dropdown (visible inside card for easy moving on touch devices)
            let stageOptions = STAGES.map(s => 
                `<option value="${s}" ${s === grievance.stage ? 'selected' : ''}>${s}</option>`
            ).join('');

            card.innerHTML = `
                <div class="flex justify-between items-start mb-2">
                    <h4 class="font-bold text-gray-900">${grievance.officerName}</h4>
                    <span class="text-xs font-mono bg-gray-100 text-gray-600 px-2 py-1 rounded border border-gray-200">#${grievance.badgeNumber}</span>
                </div>
                <p class="text-sm text-gray-600 mb-3 line-clamp-3">${grievance.description}</p>
                <div class="flex justify-between items-center text-xs text-gray-500 mb-3">
                    <span class="flex items-center gap-1">
                        <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>
                        ${formattedDate}
                    </span>
                </div>
                <div class="pt-2 border-t border-gray-100 flex items-center justify-between gap-2">
                    <!-- Dropdown for moving stages easily on mobile -->
                    <select onchange="updateStage('${grievance.id}', this.value)" class="text-xs border-gray-300 rounded shadow-sm focus:ring-mpaGold focus:border-mpaGold text-mpaBlue bg-gray-50 flex-1">
                        ${stageOptions}
                    </select>
                    <button onclick="deleteGrievance('${grievance.id}')" class="text-red-400 hover:text-red-600 p-1" title="Delete">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
                    </button>
                </div>
            `;
            return card;
        }

        // Modal toggling with transition
        function toggleForm() {
            if (formModal.classList.contains('hidden')) {
                formModal.classList.remove('hidden');
                // Small delay to allow display:block to apply before animating opacity
                setTimeout(() => {
                    formModal.classList.remove('opacity-0');
                    formContainer.classList.remove('scale-95');
                }, 10);
            } else {
                formModal.classList.add('opacity-0');
                formContainer.classList.add('scale-95');
                setTimeout(() => {
                    formModal.classList.add('hidden');
                    grievanceForm.reset();
                }, 300);
            }
        }

        // Form Submit Handler
        function handleFormSubmit(e) {
            e.preventDefault();
            
            const newGrievance = {
                id: 'g_' + Date.now().toString(36) + Math.random().toString(36).substr(2),
                officerName: document.getElementById('officerName').value.trim(),
                badgeNumber: document.getElementById('badgeNumber').value.trim(),
                date: document.getElementById('incidentDate').value,
                description: document.getElementById('description').value.trim(),
                stage: STAGES[0] // Always starts at Stage 1
            };

            grievances.push(newGrievance);
            saveGrievances();
            renderBoard();
            toggleForm();
        }

        // Delete grievance
        function deleteGrievance(id) {
            if(confirm('Are you sure you want to delete this record? This action cannot be undone.')) {
                grievances = grievances.filter(g => g.id !== id);
                saveGrievances();
                renderBoard();
            }
        }

        // Update stage via dropdown (Mobile friendly)
        function updateStage(id, newStage) {
            const index = grievances.findIndex(g => g.id === id);
            if (index !== -1) {
                grievances[index].stage = newStage;
                saveGrievances();
                renderBoard();
            }
        }

        // --- Drag and Drop Handlers ---
        let draggedId = null;

        function handleDragStart(e) {
            draggedId = e.currentTarget.dataset.id;
            e.dataTransfer.effectAllowed = 'move';
            e.currentTarget.classList.add('opacity-50');
            // Adding a class to body to prevent text selection during drag
            document.body.classList.add('select-none'); 
        }

        function handleDragEnd(e) {
            e.currentTarget.classList.remove('opacity-50');
            document.body.classList.remove('select-none');
            
            // Cleanup any highlighted dropzones
            document.querySelectorAll('.drag-over').forEach(el => {
                el.classList.remove('drag-over');
            });
        }

        function handleDragOver(e) {
            e.preventDefault(); // Required to allow dropping
            e.dataTransfer.dropEffect = 'move';
            // Find closest dropzone in case we hover over a child element
            const dropzone = e.target.closest('[data-stage]');
            if (dropzone) {
                dropzone.classList.add('drag-over');
            }
        }

        function handleDragLeave(e) {
            const dropzone = e.target.closest('[data-stage]');
            if (dropzone) {
                dropzone.classList.remove('drag-over');
            }
        }

        function handleDrop(e) {
            e.preventDefault();
            const dropzone = e.target.closest('[data-stage]');
            
            if (dropzone && draggedId) {
                const newStage = dropzone.dataset.stage;
                dropzone.classList.remove('drag-over');
                
                // Update stage and re-render
                updateStage(draggedId, newStage);
            }
        }

        // Initialize App on load
        window.addEventListener('DOMContentLoaded', () => {
            loadGrievances();
            
            // Add some mock data if empty for demonstration purposes (optional)
            if (grievances.length === 0) {
                grievances = [
                    {
                        id: 'mock1',
                        officerName: 'John Doe',
                        badgeNumber: '1042',
                        date: '2026-09-25',
                        description: 'Received NOI regarding patrol vehicle accident on Main St.',
                        stage: 'NOI Served'
                    },
                    {
                        id: 'mock2',
                        officerName: 'Jane Smith',
                        badgeNumber: '2155',
                        date: '2026-09-20',
                        description: 'Use of force inquiry review board.',
                        stage: 'Interview scheduled'
                    }
                ];
                saveGrievances();
            }

            renderBoard();
        });
    </script>
</body>
</html>
